name: content-studio
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studio_dev}
      POSTGRES_DB: content_studio
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - studio-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d content_studio"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  studio-postgres:

