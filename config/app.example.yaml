active_model: local_qwen3
models:
  local_qwen3:
    provider: ollama
    base_url: http://127.0.0.1:11434
    model: qwen3:latest
    timeout_seconds: 180
    temperature: 0
    max_tokens: 1600
  deepseek:
    provider: deepseek
    base_url: https://api.deepseek.com
    model: deepseek-flash
    api_key_env: DEEPSEEK_API_KEY
    timeout_seconds: 180
    temperature: 0
    max_tokens: 1600
mcp:
  business_url: http://127.0.0.1:8001/mcp
  tavily_url: https://mcp.tavily.com/mcp/
  tavily_key_env: TAVILY_API_KEY
  tavily_protocol_mode: legacy
  connect_attempts: 3
  # proxy_url: http://127.0.0.1:7890  # Only when this proxy is actually available.
  call_timeout_seconds: 240
  external_timeout_seconds: 60
search:
  max_results: 4
  min_results: 1
  cache_ttl_seconds: 3600
  material_ttl_seconds: 86400
worker:
  poll_seconds: 0.5
  heartbeat_seconds: 10
  lease_seconds: 60
limits:
  max_tool_attempts: 3
  max_business_calls: 30
  max_context_calls: 12
  max_replans: 3
  run_timeout_seconds: 900
  max_model_rounds: 24
fault_injection:
  once_tool: null
  pause_after_failure: false

